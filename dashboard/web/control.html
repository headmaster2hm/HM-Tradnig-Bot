<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HM Control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%235b66ff'/%3E%3Cpath d='M6 24v-5l4-6 4 3 4-8 4 6' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <!-- login -->
  <div class="login-view" id="login-view" hidden>
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="logo">HM<span class="c">▌</span></div>
      <h1 class="login-title">Control panel</h1>
      <p class="login-sub">Restricted area — owner only.</p>
      <label class="field">
        <span>Username</span>
        <input id="login-user" name="username" type="text" autocomplete="username" spellcheck="false" />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" />
      </label>
      <div class="login-err" id="login-err"></div>
      <button class="btn primary block" type="submit">Unlock</button>
    </form>
  </div>

  <!-- panel -->
  <div class="panel" id="panel-view" hidden>
    <aside class="side">
      <div class="logo side-logo">HM<span class="c">▌</span></div>
      <nav class="nav" id="nav">
        <button data-view="overview" class="nav-btn active">Overview</button>
        <button data-view="settings" class="nav-btn">Settings</button>
        <button data-view="users" class="nav-btn">Users</button>
        <button data-view="payments" class="nav-btn">Payments</button>
        <button data-view="keys" class="nav-btn">License keys</button>
        <button data-view="trades" class="nav-btn">Trades</button>
        <button data-view="logs" class="nav-btn">Logs</button>
        <button data-view="security" class="nav-btn">Security</button>
      </nav>
      <div class="side-foot">
        <a class="side-link" href="/app">Open user dashboard ↗</a>
        <button class="btn ghost" id="logout-btn">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div class="page-title" id="page-title">Overview</div>
        <div class="top-right" id="top-right"></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="ui.js"></script>
</body>
</html>
