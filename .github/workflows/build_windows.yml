name: Build Windows Agent Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent_app.py"
      - "bridge_agent.py"
      - "bridge_defaults.py"
      - "mt5_detect.py"
      - "agent_app.spec"
      - "installer/**"
      - "assets/**"

jobs:
  build:
    name: Build HMBotBridgeAgent-Setup.exe
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Bake server defaults
        env:
          HM_BRIDGE_URL: ${{ vars.HM_BRIDGE_URL }}
          HM_BRIDGE_TOKEN: ${{ secrets.HM_BRIDGE_TOKEN }}
        run: python installer\bake_defaults.py

      - name: Install build tools
        run: python -m pip install pyinstaller pillow MetaTrader5 websocket-client numpy

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean agent_app.spec

      - name: Compile installer (Inno Setup)
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\agent_setup.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HMBotBridgeAgent-Setup
          path: dist\HMBotBridgeAgent-Setup.exe
          if-no-files-found: error
